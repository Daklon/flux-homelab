---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rook-ceph
  namespace: flux-system
spec:
  interval: 10m0s
  url: https://charts.rook.io/release
---
# Operador Rook
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: flux-system
spec:
  releaseName: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  targetNamespace: rook-ceph
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 10m0s
  values:
    csi:
      kubeletDirPath: /var/lib/k0s/kubelet
      pluginTolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      provisionerTolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
---
# Cluster Ceph + pools + storage classes
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: flux-system
spec:
  dependsOn:
    - name: rook-ceph
  releaseName: rook-ceph-cluster
  chart:
    spec:
      chart: rook-ceph-cluster
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  targetNamespace: rook-ceph
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 10m0s
  values:
    operatorNamespace: rook-ceph

    cephClusterSpec:
      dataDirHostPath: /var/lib/rook
      mon:
        count: 1
        allowMultiplePerNode: false
      mgr:
        count: 1
        allowMultiplePerNode: false
      dashboard:
        enabled: true
        ssl: true
      resources:
        mon:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 500m
            memory: 2Gi
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: "debian"
            devices:
              - name: "/dev/sdb"
          - name: "master2"
            devices:
              - name: "/dev/sdb"

    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 2
          dataPools:
            - failureDomain: host
              replicated:
                size: 2
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: false
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                cpu: 500m
                memory: 4Gi
            priorityClassName: system-cluster-critical
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          parameters:
            csi.storage.k8s.io/fstype: ext4

    cephBlockPools:
      - name: ceph-block
        spec:
          failureDomain: host
          replicated:
            size: 2
            requireSafeReplicaSize: false
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          parameters:
            csi.storage.k8s.io/fstype: ext4
